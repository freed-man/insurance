
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Vehicle Insurance</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f3f6f9;
            color: #172b4d;
            font-family: Arial, Helvetica, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 520px;
            padding: 36px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(20, 40, 70, 0.09);
        }

        .brand {
            color: #176b50;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h1 {
            margin: 14px 0 12px;
            font-size: 30px;
            line-height: 1.2;
        }

        .intro {
            color: #526176;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 26px 0 9px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ccd5df;
            border-radius: 8px;
            font-size: 21px;
            font-weight: bold;
            text-transform: uppercase;
        }

        input:focus {
            outline: 3px solid #bde8d5;
            border-color: #176b50;
        }

        button {
            width: 100%;
            margin-top: 16px;
            padding: 15px;
            border: 0;
            border-radius: 8px;
            background: #176b50;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        #result {
            display: none;
            margin-top: 22px;
            padding: 18px;
            border-radius: 10px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        #result.visible { display: block; }
        #result.invalid { background: #fff2df; color: #794600; }
        #result.unknown { background: #eef3f8; color: #33465c; }
        #result.insured { background: #e4f6eb; color: #145c35; }
        #result.uninsured { background: #fde9e7; color: #8c211b; }

        .symbol {
            font-size: 28px;
            font-weight: bold;
        }

        .disclaimer {
            margin-top: 24px;
            color: #68778a;
            font-size: 12px;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            .card { padding: 24px; }
            h1 { font-size: 26px; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand">Vehicle checker</div>
        <h1>Check vehicle insurance</h1>
        <p class="intro">
            Enter a UK vehicle registration to check its insurance status.
        </p>

        <form id="check-form">
            {% csrf_token %}
            <label for="registration">Vehicle registration</label>
            <input
                id="registration"
                name="registration"
                type="text"
                placeholder="AB12 CDE"
                maxlength="8"
                autocomplete="off"
                autocapitalize="characters"
                required
            >
            <button id="submit-button" type="submit">
                Check insurance
            </button>
        </form>

        <section id="result" role="status" aria-live="polite"></section>

        <p class="disclaimer">
            The live insurance lookup has not yet been connected.
            This page does not currently confirm whether a vehicle is insured.
        </p>
    </main>

    <script>
        const form = document.getElementById("check-form");
        const input = document.getElementById("registration");
        const button = document.getElementById("submit-button");
        const result = document.getElementById("result");

        function showResult(status, message, registration = "") {
            const styles = {
                insured: ["✓", "Insurance confirmed"],
                uninsured: ["✕", "Insurance not confirmed"],
                unknown: ["?", "Unable to verify"],
                invalid: ["!", "Check your entry"]
            };

            const [symbol, heading] = styles[status] || styles.unknown;

            result.className = `visible ${status}`;
            result.replaceChildren();

            const icon = document.createElement("div");
            icon.className = "symbol";
            icon.textContent = symbol;

            const title = document.createElement("strong");
            title.textContent = registration
                ? `${heading}: ${registration}`
                : heading;

            const detail = document.createElement("p");
            detail.textContent = message;

            result.append(icon, title, detail);
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            button.disabled = true;
            button.textContent = "Checking...";
            result.className = "";
            result.textContent = "";

            try {
                const response = await fetch("/api/check/", {
                    method: "POST",
                    body: new FormData(form),
                    headers: {
                        "X-Requested-With": "XMLHttpRequest"
                    }
                });

                const data = await response.json();

                if (!response.ok) {
                    showResult(
                        "invalid",
                        data.message || "Please check your entry."
                    );
                } else {
                    showResult(
                        data.status,
                        data.message,
                        data.registration
                    );
                }
            } catch (error) {
                showResult(
                    "unknown",
                    "The check could not be completed. Please try again."
                );
            } finally {
                button.disabled = false;
                button.textContent = "Check insurance";
            }
        });
    </script>
</body>
</html>
