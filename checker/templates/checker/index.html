<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check vehicle insurance</title>
    <style>
        body {
            max-width: 440px;
            margin: 20vh auto 0;
            padding: 0 20px;
            font-family: Arial, Helvetica, sans-serif;
            color: #172b4d;
        }

        form {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 2px solid #ccd5df;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
        }

        button {
            padding: 12px 18px;
            border: 0;
            border-radius: 8px;
            background: #176b50;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #result {
            margin-top: 16px;
            font-size: 18px;
        }

        #result.insured { color: #145c35; }
        #result.uninsured { color: #8c211b; }
    </style>
</head>
<body>
    <form id="check-form" method="post">
        <input
            name="registration"
            placeholder="AB12 CDE"
            maxlength="8"
            autocomplete="off"
            autocapitalize="characters"
            aria-label="Vehicle registration"
            required
        >
        <button id="submit-button" type="submit">Check insurance</button>
    </form>

    <p id="result" role="status"></p>

    <script>
        const form = document.getElementById("check-form");
        const button = document.getElementById("submit-button");
        const result = document.getElementById("result");

        const MESSAGES = {
            insured: "showing as insured",
            uninsured: "not showing as insured",
            invalid: "That doesn't look like a UK registration.",
            unknown: "Couldn't check right now. Please try again."
        };

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            button.disabled = true;
            result.className = "";
            result.textContent = "Checking...";

            let data = {};
            try {
                const response = await fetch("{% url 'check_insurance' %}", {
                    method: "POST",
                    body: new FormData(form)
                });
                data = await response.json();
            } catch (error) {
                // Network failure or a non-JSON error page: shown as "unknown".
            }

            const status = Object.hasOwn(MESSAGES, data.status)
                ? data.status
                : "unknown";

            let text = MESSAGES[status];
            if (status === "insured" || status === "uninsured") {
                text = `${data.registration}: ${text}`;
                if (data.vehicle) {
                    text += ` (${data.vehicle})`;
                }
            }

            result.className = status;
            result.textContent = text;
            button.disabled = false;
        });
    </script>
</body>
</html>
